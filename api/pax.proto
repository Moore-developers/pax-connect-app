// Private history; opaque frozen cursors.

message EventCategory {string key=1;string name=2;string symbol=3;}
message EventField {string label=1;string value=2;string before=3;string after=4;}
message EventSection {string kind=1;string title=2;repeated EventField fields=3;}
message SystemEvent {string type=1;string name=2;EventCategory category=3;string result=4;string error_code=5;google.protobuf.Timestamp started_at=6;repeated EventSection sections=7;}
message LogQuery {
 string dimension = 1; string object_id = 2; string search = 3;
 string level = 4; string route_id = 5;
 google.protobuf.Timestamp from = 6; google.protobuf.Timestamp until = 7;
 string read_token = 8; string cursor = 9; uint32 limit = 10;
 string view = 11; string problem_id = 12; string connection_key = 13;
 bool include_dns = 14;
 string quick=15; LogCriteria criteria=16; string scope=17;
}
message LogCriteria {
 repeated string kinds=1; repeated string levels=2; string application=3; string domain=4; string domain_mode=5;
 string target_ip=6; repeated string transports=7; uint32 port=8; repeated string directions=9; string route=10; string rule_package=11;
 uint64 min_latency_ms=12; string dns_answer_ip=13;
}
message LogOptions {repeated string applications=1;repeated string routes=2;repeated string rule_packages=3;}
message LogPage {
 repeated ProductLog items = 1; string next_cursor = 2; string read_token = 3;
 HistoryState history = 4; uint64 total = 5; uint64 head_sequence=6; uint64 problem_groups=7; repeated LogRecord records=8; google.protobuf.Timestamp as_of=9; LogOptions options=10;
}
message LogObject { string id = 1; string name = 2; uint64 count = 3; string symbol=4; }
message LogObjectPage {
 repeated LogObject items = 1; string next_cursor = 2; string read_token = 3;
 HistoryState history = 4; uint64 total_events = 5; uint64 unknown_events = 6; LogObject selected_object=7;
}
message LogDetailRequest { string event_id = 1; LogQuery query = 2; string record_id = 3; }
