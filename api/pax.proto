 ProductLog event = 1; FlowRecord flow = 2;
 repeated string raw = 3; bool truncated = 4; string raw_omitted = 5;
 repeated ProductLog timeline = 6; uint64 total_events = 7; LogRecord record=8;
}











message ClearLogsRequest { string operation_id = 1; google.protobuf.Timestamp requested_at = 2; }

// Current mixed-egress proof; never evidence of global TUN/DNS/IPv6 protection.
message CurrentPathCheck {
 string check_id=1; string trigger_operation_id=2; string route_id=3;
 uint64 config_revision=4; string core_session=5; uint64 runtime_version=6;
 string network_epoch=7; string state=8; string cause=9;
 google.protobuf.Timestamp started_at=10; google.protobuf.Timestamp completed_at=11;
 string evidence_scope=12; repeated string command_operation_ids=13;
}
