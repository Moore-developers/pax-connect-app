message HistoryDelta {
 HistoryState history=1; TrafficSnapshot traffic=2;
 repeated ProductLog recent_logs=3; bool replace_recent_logs=4;
}
message LogUpdateRequest {
 LogQuery filter=1; uint64 after_sequence=2;
 uint64 deletion_generation=3; string journal_generation=4;
 bool count_only=5; uint32 limit=6;
}
message LogUpdatePage {
 repeated ProductLog items=1; uint64 count=2; bool exact=3;
 uint64 high_water=4; uint64 next_sequence=5; bool has_more=6;
 bool reset_required=7; HistoryState history=8;
 google.protobuf.Timestamp as_of=9;
}

// A frozen connection summary, distinct from the original diagnostic events.
message ConnectionMetrics {
 uint64 duration_ms=1; string duration_state=2;
 uint64 upload=3; uint64 download=4; string bytes_state=5;
 google.protobuf.Timestamp bytes_from=6; google.protobuf.Timestamp as_of=7;
 string reason=8;
}
message LogRecord {
 string kind=1; string record_id=2; string event_id=3;
 LogLevel level=4; string title=5; string source=6;
 FlowRecord flow=7; ConnectionMetrics metrics=8;
 google.protobuf.Timestamp first_at=9; google.protobuf.Timestamp last_at=10;
 uint64 event_count=11; google.protobuf.Timestamp as_of=12;string operation_from=13;string operation_to=14;string system_category=15; SystemEvent system_event=16; string category_name=17; string category_symbol=18;
}

// Anonymous same-origin favicon only. fetch=false never initiates network I/O.
message ObjectIconRequest { string host = 1; bool fetch = 2; uint64 log_deletion_generation = 3; }
message ObjectIconResult {
 string host = 1; bytes png = 2; string state = 3; string reason = 4;
 google.protobuf.Timestamp expires_at = 5; uint64 log_deletion_generation = 6;
}

// Read-only sanitized local configured policy while direct, or committed rules while running.
message RoutingRule { string id=1; uint32 order=2; string match=3; string action=4; string source=5; }
message RoutingRulesSnapshot {string state=1; repeated RoutingRule rules=2; google.protobuf.Timestamp at=3;}

// Rule management is local and available with proxy OFF. Commands return the committed snapshot.
message RoutingEntry { string id=1; string method=2; string target=3; string destination=4; bool enabled=5; }
// kind: priority, local, subscription, geo, adblock (fixed built-in, block only).
message RoutingPackage {
 string id=1; string name=2; string kind=3; string destination=4; bool enabled=5;
 repeated RoutingEntry rules=6; string source=7; string version=8; string previous_version=9;
 bool automatic=10; string update_message=11;int64 updated_unix=12;
}
message RoutingApplication {string id=1;string name=2;repeated string domains=3;}
message RoutingLibrarySnapshot {
 uint64 revision=1;repeated RoutingPackage packages=2;repeated RoutingApplication applications=3;
 repeated NodeProfile routes=4;string state=5;string message=6;
}
message RoutingMutationRequest {
 uint64 expected_revision=1;string action=2;string package_id=3;string rule_id=4;
 RoutingPackage package=5;RoutingEntry rule=6;sint32 delta=7;bool enabled=8;string destination=9;
 repeated RoutingEntry rules=10;
}

message GeoRulesQuery {string search=1;uint32 offset=2;uint32 limit=3;}
message GeoRulesPage {repeated RoutingEntry rules=1;uint32 total=2;uint32 next_offset=3;string version=4;int64 updated_unix=5;}
